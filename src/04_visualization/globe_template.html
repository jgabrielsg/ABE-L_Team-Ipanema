<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8e0cc">
<title>Demographic Atlas · WPP 2024</title>
<style>
  :root{
    --paper:#f4eee0; --paper2:#faf6ea; --page:#e8e0cc; --ink:#2a2722; --muted:#6f675a; --faint:#a89f8c;
    --ox:#8b2e1f; --serif:"Palatino Linotype",Palatino,"Book Antiqua","Iowan Old Style",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--page);color:var(--ink);overflow:hidden;font-family:var(--serif);-webkit-font-smoothing:antialiased}
  #globe{position:fixed;inset:0}
  #frame{position:fixed;inset:9px;border:1px solid var(--ink);pointer-events:none;z-index:9;outline:1px solid var(--ink);outline-offset:4px}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  .box{background:var(--paper2);border:1px solid var(--ink);box-shadow:3px 3px 0 rgba(42,39,34,.18)}
  .sc{font-variant:small-caps;letter-spacing:.09em}

  /* ---- cartouche ---- */
  #title{position:fixed;left:30px;top:30px;z-index:5;padding:3px;max-width:340px}
  #title .in{border:1px solid var(--ink);padding:12px 16px 11px}
  #title h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  #title .sub{margin-top:4px;font-size:12.5px;font-style:italic;color:var(--muted)}
  #world{margin-top:9px;padding-top:8px;border-top:1px solid var(--ink);font-size:12px;color:var(--muted);display:flex;align-items:baseline;gap:9px}
  #world em{font-style:normal}
  #world .s{display:none}
  #world b{font-size:19px;color:var(--ink);font-weight:700;font-variant-numeric:lining-nums tabular-nums}

  /* ---- layers ---- */
  #metrics{position:fixed;left:30px;top:50%;transform:translateY(-35%);z-index:5;width:206px;padding:3px}
  #metrics .in{border:1px solid var(--ink);padding:10px 4px 6px}
  #metrics .hd{font-size:12px;padding:0 12px 7px;border-bottom:1px solid var(--ink);margin-bottom:4px}
  .mbtn{display:flex;align-items:baseline;gap:9px;width:100%;background:none;border:0;border-left:3px solid transparent;text-align:left;padding:5px 12px 5px 9px;font-size:14px;color:var(--muted)}
  .mbtn:hover{color:var(--ink);background:rgba(42,39,34,.05)}
  .mbtn.on{color:var(--ink);font-weight:700;border-left-color:var(--ox);background:rgba(139,46,31,.07)}
  .mbtn s{text-decoration:none;font-size:11px;width:14px;color:var(--faint);font-variant-numeric:lining-nums}

  /* ---- tools ---- */
  #tools{position:fixed;right:30px;top:30px;z-index:7;display:flex;gap:6px;align-items:stretch}
  #search{width:220px;padding:7px 11px;border:1px solid var(--ink);background:var(--paper2);outline:none;font-size:14px;font-style:italic}
  #search:focus{background:#fff}
  #sbox{position:relative;display:flex}
  #search{-webkit-appearance:none;appearance:none;border-radius:0}
  #search::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
  #sugg{display:none;position:absolute;right:0;top:calc(100% + 5px);width:max(100%,230px);max-height:min(52vh,330px);overflow:auto;-webkit-overflow-scrolling:touch;background:var(--paper2);border:1px solid var(--ink);box-shadow:3px 3px 0 rgba(42,39,34,.28);z-index:25}
  #sugg.open{display:block}
  .si{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:9px 12px;font-size:15px;color:var(--ink);border-bottom:1px dotted var(--faint);cursor:pointer}
  .si:last-child{border-bottom:0}
  .si small{font-size:10.5px;letter-spacing:.08em;color:var(--faint)}
  .si.on,.si:hover{background:rgba(138,31,31,.08);box-shadow:inset 3px 0 0 var(--ox)}
  .si.none{color:var(--muted);font-style:italic;cursor:default}
  .si.none:hover{background:none;box-shadow:none}
  .tbtn{padding:7px 13px;border:1px solid var(--ink);background:var(--paper2);font-size:13px}
  .tbtn:hover{background:var(--ink);color:var(--paper2)}

  /* ---- key + timeline ---- */
  #dock{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:5;width:min(800px,calc(100vw - 470px));min-width:460px;padding:3px}
  #dock .in{border:1px solid var(--ink);padding:9px 16px 9px}
  #legendttl{font-size:13px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  #legendttl b{font-size:14px}
  #legendttl i{color:var(--muted);font-size:12.5px}
  #legend{display:flex;gap:0}
  .cls{flex:1;min-width:0;text-align:center}
  .cls .sw{height:14px;border:1px solid var(--ink);border-left-width:0}
  .cls:first-child .sw{border-left-width:1px}
  .cls .lb{font-size:11px;line-height:1.15;margin-top:3px;color:var(--muted);font-variant-numeric:lining-nums}
  #timeline{display:flex;align-items:center;gap:14px;margin-top:9px;padding-top:8px;border-top:1px solid var(--ink)}
  #play{width:32px;height:32px;border:1px solid var(--ink);background:var(--paper2);display:grid;place-items:center;flex:none;padding:0}
  #play:hover{background:var(--ink)}#play:hover svg{fill:var(--paper2)}
  #play svg{width:12px;height:12px;fill:var(--ink)}
  #yearbox{width:120px;flex:none;text-align:center;white-space:nowrap}
  #year{font-size:27px;font-weight:700;line-height:1;font-variant-numeric:lining-nums tabular-nums}
  #phase{font-size:11px;margin-top:3px;color:var(--muted);font-style:italic}
  #phase.proj{color:var(--ox)}
  #tl{flex:1;position:relative;padding-bottom:15px}
  #slider{display:block;width:100%;-webkit-appearance:none;appearance:none;height:16px;margin:0;background-color:transparent;
    background-image:linear-gradient(90deg,var(--ink) 49.3%,transparent 49.3%),repeating-linear-gradient(90deg,var(--ox) 0 5px,transparent 5px 9px);
    background-size:100% 2px,100% 2px;background-position:center,center;background-repeat:no-repeat;outline:none}
  #slider::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--paper2);border:2px solid var(--ink);cursor:pointer}
  #slider::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--paper2);border:2px solid var(--ink);cursor:pointer}
  #slider:disabled{opacity:.35}
  #tlab{position:absolute;left:0;right:0;bottom:0;height:13px;font-size:10.5px;color:var(--muted)}
  #tlab span{position:absolute;transform:translateX(-50%);font-variant-numeric:lining-nums}

  /* ---- tooltip ---- */
  .scene-tooltip{z-index:30 !important}
  .tip{padding:6px 10px;background:var(--paper2);border:1px solid var(--ink);font:13px var(--serif);color:var(--ink);box-shadow:2px 2px 0 rgba(42,39,34,.2)}
  .tip b{font-size:14px}.tip .v{font-weight:700;color:var(--ox)}.tip .m{color:var(--muted);font-style:italic}
  .clab{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;font:700 10px "Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;letter-spacing:.1em;text-transform:uppercase;color:#1f1c17;
    text-shadow:0 0 2px #f4eee0,0 0 2px #f4eee0,0 0 4px #f4eee0,0 0 6px rgba(244,238,224,.9);will-change:transform}
  .clab.off{visibility:hidden}
  #lbls{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
  #tipbox{position:fixed;left:0;top:0;z-index:30;pointer-events:none;display:none}
  .tip i.sq{display:inline-block;width:10px;height:10px;border:1px solid var(--ink);margin-right:5px;vertical-align:-1px}

  /* ---- gazetteer panel ---- */
  #panel{position:fixed;right:30px;top:78px;bottom:28px;width:380px;z-index:6;padding:3px;transform:translateX(calc(100% + 40px));transition:transform .4s cubic-bezier(.2,.8,.2,1)}
  #panel.open{transform:none}
  body.pan #dock{left:calc(50% - 90px);width:min(800px,calc(100vw - 692px));min-width:430px}
  #pin{height:100%;border:1px solid var(--ink);position:relative;display:flex;flex-direction:column;min-height:0}
  #pscroll{overflow-y:auto;padding:16px 18px 20px;flex:1}
  #pscroll::-webkit-scrollbar{width:8px}#pscroll::-webkit-scrollbar-thumb{background:var(--faint)}
  #close{position:absolute;right:8px;top:8px;width:26px;height:26px;border:1px solid var(--ink);background:var(--paper2);font-size:15px;line-height:1;z-index:2;padding:0}
  #close:hover{background:var(--ink);color:var(--paper2)}
  .cname{font-size:28px;font-weight:700;line-height:1.05;margin:0 34px 3px 0;letter-spacing:.01em}
  .csub{font-size:13px;color:var(--muted);font-style:italic;padding-bottom:10px;border-bottom:2px solid var(--ink)}
  .tag{display:inline-flex;align-items:center;gap:7px;margin-top:11px;font-size:13px;padding:3px 9px 3px 7px;border:1px solid var(--ink)}
  .tag i{width:11px;height:11px;border:1px solid var(--ink)}
  h3{font-size:12.5px;font-weight:400;margin:20px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--ink)}
  h3 em{color:var(--muted)}
  .gz .r{display:flex;align-items:baseline;gap:6px;padding:2.5px 0;font-size:14.5px}
  .gz .l{color:var(--ink)}
  .gz .d{flex:1;border-bottom:1px dotted var(--faint);transform:translateY(-3px)}
  .gz .n{font-weight:700;font-variant-numeric:lining-nums tabular-nums}
  .gz .u{color:var(--muted);font-size:12px;font-weight:400;margin-left:4px;font-style:italic}
  .chart{border:1px solid var(--faint);background:#fffdf6;padding:4px 2px 0}
  .chart svg{display:block;width:100%;height:auto}
  .note{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:6px;font-style:italic}
  .ins{list-style:none;padding:0;margin:0}
  .ins li{padding:7px 0;border-top:1px dotted var(--faint);font-size:14px;line-height:1.4}
  .ins li:first-child{border-top:0}
  .foot{position:fixed;left:32px;bottom:28px;font-size:11px;color:var(--muted);z-index:4;max-width:230px;line-height:1.35;font-style:italic}
  #mwrap,#dfoot{display:none}
  .bnd{position:relative;height:13px;font-size:9px;color:var(--muted);margin-top:2px}
  .bnd span{position:absolute;transform:translateX(-50%);white-space:nowrap}
  .chips{display:flex;gap:12px;font-size:9.5px;color:var(--muted);margin-top:2px}
  .chip i{display:inline-block;width:10px;height:8px;border:1px solid var(--ink);margin-right:4px;vertical-align:-1px}
  @media (max-width:900px){
    html,body{touch-action:manipulation}
    #frame{inset:4px;outline:none}
    #title{left:10px;top:calc(10px + env(safe-area-inset-top));padding:2px;max-width:calc(100vw - 20px)}
    #title .in{padding:7px 11px 6px;display:flex;align-items:baseline;gap:10px}
    #title h1{font-size:13px;letter-spacing:.12em;white-space:nowrap}
    #title .sub{display:none}
    #world{margin:0;padding:0;border:0;font-size:11px;gap:5px}
    #world b{font-size:14px}
    #world{display:none}
    #metrics,.foot{display:none}
    #tools{left:10px;right:10px;top:calc(54px + env(safe-area-inset-top));gap:5px}
    #sbox{flex:1;min-width:0}
    #search{flex:1;width:100%;min-width:0;font-size:16px;padding:5px 10px}
    .tbtn{padding:5px 11px;font-size:13px}
    #dock{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));transform:none;width:auto;min-width:0;padding:2px}
    #dock .in{padding:7px 10px 6px}
    #mwrap{display:flex;align-items:stretch;position:relative;margin:0 0 7px;background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 rgba(42,39,34,.18)}
    #mtag{display:flex;align-items:center;padding:0 10px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--faint);background:var(--paper2);white-space:nowrap}
    #msel{display:block;flex:1;min-width:0;margin:0;padding:9px 34px 9px 11px;font:inherit;font-size:16px;font-weight:600;letter-spacing:.01em;border:0;border-radius:0;background:transparent;color:var(--ink);-webkit-appearance:none;appearance:none;text-overflow:ellipsis;outline:none}
    #mwrap .chev{position:absolute;right:0;top:0;bottom:0;width:30px;border-left:1px solid var(--faint);background:var(--paper2);pointer-events:none}
    #mwrap .chev::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translate(-50%,-70%) rotate(45deg)}
    #msel{text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden}
    #mpop{display:none;position:absolute;left:-1px;right:-1px;bottom:calc(100% + 7px);max-height:min(66vh,400px);overflow:auto;background:var(--paper2);border:1px solid var(--ink);box-shadow:3px 3px 0 rgba(42,39,34,.28);z-index:20}
    #mwrap.open #mpop{display:block}
    #mwrap.open .chev::after{transform:translate(-50%,-30%) rotate(-135deg)}
    .mo{display:flex;align-items:baseline;gap:11px;width:100%;text-align:left;padding:8px 13px;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;border-bottom:1px dotted var(--faint);border-radius:0}
    .mo:last-child{border-bottom:0}
    .mo s{text-decoration:none;color:var(--faint);font-size:12px;width:12px;flex:none}
    .mo.on{font-weight:700;background:rgba(138,31,31,.08);box-shadow:inset 3px 0 0 var(--ox)}
    #mwrap:focus-within{box-shadow:0 0 0 2px rgba(138,31,31,.35),2px 2px 0 rgba(42,39,34,.18)}
    #legendttl{margin-bottom:4px}
    #legendttl b{display:none}
    #legendttl i{font-size:11.5px;margin-left:auto}
    #legend{display:block}
    #legend .row{display:flex}
    #timeline{margin-top:6px;padding-top:6px;gap:9px}
    #yearbox{width:96px}
    #year{font-size:21px}
    #phase{font-size:9.5px}
    #play{width:38px;height:38px}
    #tl{padding-bottom:13px;margin:0 12px 0 10px}
    #slider{height:30px}
    #slider::-webkit-slider-thumb{width:24px;height:24px}
    #slider::-moz-range-thumb{width:20px;height:20px}
    #tlab span:nth-child(even){display:none}
    #dfoot{display:block;font-size:8.5px;color:var(--muted);font-style:italic;margin-top:3px;line-height:1.25}
    /* ficha do pa\u00eds vira folha inferior; o dock some enquanto ela est\u00e1 aberta */
    #panel{left:8px;right:8px;width:auto;top:auto;bottom:calc(8px + env(safe-area-inset-bottom));height:58vh;height:58dvh;max-height:520px;transform:translateY(calc(100% + 24px))}
    #panel.open{transform:none}
    body.pan #dock{display:none}
    #pscroll{padding:12px 14px 16px}
    .cname{font-size:22px}
    .csub{font-size:12px}
    .gz .r{font-size:13.5px}
    h3{margin-top:16px}
  }
  @media (max-width:900px) and (orientation:landscape){
    #title .in{padding:5px 10px 4px}
    #tools{left:auto;right:10px;top:calc(10px + env(safe-area-inset-top))}
    #sbox{flex:none}
    #search{flex:none;width:150px}
    body.pan #tools{display:none}
    #panel{left:auto;right:8px;top:8px;bottom:8px;width:min(340px,46vw);height:auto;max-height:none;transform:translateX(calc(100% + 24px))}
    #panel.open{transform:none}
    body.pan #dock{display:block;left:10px;right:calc(min(340px,46vw) + 16px);width:auto}
    #dock .in{display:grid;grid-template-columns:minmax(120px,200px) 1fr;column-gap:12px;align-items:center;padding:5px 10px 4px}
    #mwrap{grid-column:1;margin:0}
    #msel{padding:5px 30px 5px 9px;font-size:15px}
    #mtag{display:none}
    #legendttl{display:none}
    #legend{grid-column:2}
    #timeline{grid-column:1 / -1;margin-top:3px;padding-top:4px}
    #slider{height:22px}
    #dfoot{display:none}
    #legend .chips{display:none}
  }
</style>
</head>
<body>
<div id="globe"></div>
<div id="frame"></div>

<div id="title" class="box"><div class="in"><h1 id="t-title"></h1><div class="sub" id="t-sub"></div><div id="world"></div></div></div>

<div id="metrics" class="box"><div class="in"><div class="hd sc" id="mhd"></div><div id="mlist"></div></div></div>

<div id="tools">
  <div id="sbox"><input id="search" type="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" role="combobox" aria-autocomplete="list" aria-controls="sugg"><div id="sugg" role="listbox"></div></div>
  <button id="spin" class="tbtn"></button>
  <button id="lang" class="tbtn">PT</button>
</div>

<div id="dock" class="box"><div class="in">
  <div id="mwrap"><span id="mtag"></span><button id="msel" type="button" aria-haspopup="listbox"></button><span class="chev"></span><div id="mpop" role="listbox"></div></div>
  <div id="legendttl"><b id="lname"></b><i id="lunit"></i></div>
  <div id="legend"></div>
  <div id="timeline">
    <button id="play" aria-label="play"><svg viewBox="0 0 14 14" id="playicon"><path d="M3 1.5v11l9-5.5z"/></svg></button>
    <div id="yearbox"><div id="year">2024</div><div id="phase"></div></div>
    <div id="tl"><input id="slider" type="range" min="1950" max="2100" step="1" value="2024"><div id="tlab"></div></div>
  </div>
  <div id="dfoot"></div>
</div></div>

<div id="panel" class="box"><div id="pin"><button id="close">×</button><div id="pscroll"></div></div></div>
<div class="foot" id="foot"></div>

<script>/*__GLOBE_LIB__*/</script>
<script>
const GEO = /*__GEOJSON__*/;

function makeOceanCanvas(W, H){
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#d3e0e6'; g.fillRect(0, 0, W, H);
  const k = W/4096;
  const line = (x0,y0,x1,y1,w,a)=>{ g.strokeStyle = `rgba(52,86,106,${a})`; g.lineWidth = w*k; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke(); };
  for (let lon=-180; lon<=180; lon+=10){ const x=(lon+180)/360*W; line(x,0,x,H, lon%30===0?2.2:1.1, lon%30===0?.5:.26); }
  for (let lat=-90; lat<=90; lat+=10){ const y=(90-lat)/180*H; line(0,y,W,y, lat===0?2.2:(lat%30===0?2:1.1), lat===0?.55:(lat%30===0?.45:.26)); }
  return c;
}

function tooltip(f){
  const iso = featIso(f), nm = f.properties.name[lang];
  if (!DATA[iso]) return `<div class="tip"><b>${nm}</b><br><span class="m">${T().nodata}</span></div>`;
  const v = val(iso, metric, year), m = METRICS[metric];
  let txt = '–';
  if (v!=null) txt = metric==='p' ? fmtPop(v) : metric==='pk' ? (v>=2100 ? T().stillGrowing : String(v)) : metric==='g' ? fsgn(v,2)+'%' : metric==='m' ? fsgn(v,1) : fnum(v,metric==='t'?2:1);
  return `<div class="tip"><b>${nameOf(iso)}</b><br><i class="sq" style="background:${colorFor(metric,v)}"></i><span class="m">${T().m[metric]}${metric==='pk'?'':' · '+year}:</span> <span class="v">${txt}</span><div class="m" style="margin-top:2px">${T().click}</div></div>`;
}

/* ================= UI: camadas, legenda, linha do tempo ================= */
function buildMetrics(){
  document.getElementById('mhd').textContent = T().metrics;
  const box = document.getElementById('mlist'); box.innerHTML = '';
  ORDER.forEach((k,i)=>{
    const b = document.createElement('button'); b.className = 'mbtn'+(k===metric?' on':'');
    b.innerHTML = `<s>${i+1}</s>${T().m[k]}`; b.onclick = ()=>setMetric(k); box.appendChild(b);
  });
  const cur = document.getElementById('msel'), pop = document.getElementById('mpop'), wrap = document.getElementById('mwrap');
  document.getElementById('mtag').textContent = T().metrics;
  cur.textContent = `${ORDER.indexOf(metric)+1} · ${T().m[metric]}`;
  pop.innerHTML = ORDER.map((k,i)=>`<button type="button" class="mo${k===metric?' on':''}" data-k="${k}"><s>${i+1}</s>${T().m[k]}</button>`).join('');
  pop.onclick = e => { const b = e.target.closest('.mo'); if (b){ wrap.classList.remove('open'); setMetric(b.dataset.k); } };
  cur.onclick = () => wrap.classList.toggle('open');
  if (!buildMetrics.bound){ buildMetrics.bound = true;
    document.addEventListener('pointerdown', e => { if (!wrap.contains(e.target)) wrap.classList.remove('open'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') wrap.classList.remove('open'); }); }
}
function setMetric(k){
  metric = k; buildMetrics(); buildLegend(); document.getElementById('slider').disabled = !!METRICS[k].static;
  refresh(true); if (selected) renderPanel();
}
function buildLegend(){
  const m = METRICS[metric], n = m.col.length;
  document.getElementById('lname').textContent = T().m[metric]; document.getElementById('lunit').textContent = T().mu[metric];
  if (MOBILE.matches){
    const sw = m.col.map(c=>`<div class="cls"><div class="sw" style="background:${c}"></div></div>`).join('');
    const bl = m.br.map((b,i)=>`<span style="left:${(i+1)/n*100}%">${m.ef(b)}</span>`).join('');
    const chips = (m.still ? `<span class="chip"><i style="background:${m.still}"></i>${T().stillGrowing}</span>` : '') + `<span class="chip"><i style="background:${NODATA}"></i>${T().nodata}</span>`;
    document.getElementById('legend').innerHTML = `<div class="row">${sw}</div><div class="bnd">${bl}</div><div class="chips">${chips}</div>`;
    return;
  }
  const lab = i => i===0 ? '< '+m.ef(m.br[0]) : (i===n-1 && metric==='pk') ? m.br[n-2]+'\u20132099' : i===n-1 ? '\u2265 '+m.ef(m.br[n-2]) : m.ef(m.br[i-1])+'\u2013'+m.ef(m.br[i]);
  let h = m.col.map((c,i)=>`<div class="cls"><div class="sw" style="background:${c}"></div><div class="lb">${lab(i)}</div></div>`).join('');
  if (m.still) h += `<div class="cls" style="flex:1.5"><div class="sw" style="background:${m.still};margin-left:6px;border-left-width:1px"></div><div class="lb" style="margin-left:6px">${T().stillGrowing}</div></div>`;
  h += `<div class="cls" style="flex:1.1"><div class="sw" style="background:${NODATA};margin-left:8px;border-left-width:1px"></div><div class="lb" style="margin-left:8px">${T().nodata}</div></div>`;
  document.getElementById('legend').innerHTML = h;
}
function buildTlabels(){
  document.getElementById('tlab').innerHTML = [1950,1975,2000,2025,2050,2075,2100].map(y=>`<span style="left:${(y-Y0)/(Y1-Y0)*100}%">${y}</span>`).join('');
}
function setYear(y){
  year = y; document.getElementById('slider').value = y; document.getElementById('year').textContent = y;
  const ph = document.getElementById('phase'); const proj = y>=SPLIT;
  ph.textContent = proj ? T().proj : T().est; ph.className = proj ? 'proj' : '';
  refresh(true); updateWorld(); if (selected) updateCursor();
}
document.getElementById('slider').addEventListener('input', e=>{ stopPlay(); setYear(+e.target.value); });
function stopPlay(){ playing=false; clearInterval(timer); document.getElementById('playicon').innerHTML='<path d="M3 1.5v11l9-5.5z"/>'; }
document.getElementById('play').onclick = ()=>{
  if (METRICS[metric].static) return;
  if (playing){ stopPlay(); return; }
  playing = true; document.getElementById('playicon').innerHTML='<path d="M2.5 1.5h3v11h-3zM8.5 1.5h3v11h-3z"/>';
  if (year>=Y1) setYear(Y0);
  timer = setInterval(()=>{ if (year>=Y1){ stopPlay(); return; } setYear(year+1); }, WEAK ? 160 : 120);
};
function updateWorld(){
  let tot = 0; isos.forEach(i=>{ const v = DATA[i].p[year-Y0]; if (v!=null) tot += v; });
  document.getElementById('world').innerHTML = `<b>${fmtPop(tot)}</b><span><em class="l">${T().world}</em><em class="s">${T().worldS} · ${year}</em></span>`;
}
function setSpin(on){ spinning = on; controls.autoRotate = on; wake(); document.getElementById('spin').textContent = on ? T().spinOff : T().spin; }
document.getElementById('spin').onclick = ()=> setSpin(!spinning);
document.getElementById('lang').onclick = ()=>{ lang = lang==='pt'?'en':'pt'; applyLang(); };

function applyLang(){
  document.documentElement.lang = lang==='pt'?'pt-BR':'en';
  document.getElementById('lang').textContent = lang==='pt'?'EN':'PT';
  document.getElementById('t-title').textContent = T().title; document.getElementById('t-sub').textContent = T().sub;
  document.getElementById('search').placeholder = T().search; document.getElementById('foot').textContent = T().foot; document.getElementById('dfoot').textContent = T().foot;
  buildSuggest();
  updateLabels(true);
  setSpin(spinning); buildMetrics(); buildLegend(); buildTlabels(); setYear(year); if (selected) renderPanel();
}
/* ---------- busca com lista de sugestões (funciona em iOS/Android; sem <datalist>) ---------- */
const norm = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const sIn = document.getElementById('search'), sBox = document.getElementById('sugg');
let sList = [], sIdx = -1;
function buildSuggest(){ sList = isos.map(i => ({iso:i, n:nameOf(i), k:norm(nameOf(i))})).sort((a,b) => a.n.localeCompare(b.n)); if (sBox.classList.contains('open')) showSuggest(); }
function showSuggest(){
  const q = norm(sIn.value.trim());
  const hits = q ? sList.filter(c => c.k.startsWith(q)).concat(sList.filter(c => !c.k.startsWith(q) && c.k.split(/[\s'-]+/).some(w => w.startsWith(q))), sList.filter(c => !c.k.startsWith(q) && !c.k.split(/[\s'-]+/).some(w => w.startsWith(q)) && c.k.includes(q))) : sList;
  sIdx = hits.length && q ? 0 : -1; sBox._hits = hits;
  sBox.innerHTML = hits.length ? hits.map((c,i) => `<div class="si${i===sIdx?' on':''}" role="option" data-i="${i}"><span>${c.n}</span><small>${c.iso}</small></div>`).join('') : `<div class="si none">${lang==='pt'?'Nenhum país encontrado':'No country found'}</div>`;
  sBox.classList.add('open'); sBox.scrollTop = 0;
}
function hideSuggest(){ sBox.classList.remove('open'); sIdx = -1; }
function pickSuggest(i){ const c = sBox._hits && sBox._hits[i]; if (!c) return; sIn.value = c.n; hideSuggest(); sIn.blur(); select(c.iso, true); }
function moveSuggest(d){
  const n = (sBox._hits || []).length; if (!n) return;
  sIdx = (sIdx + d + n) % n;
  sBox.querySelectorAll('.si').forEach((e,i) => e.classList.toggle('on', i === sIdx));
  const e = sBox.children[sIdx]; if (e) e.scrollIntoView({block:'nearest'});
}
sIn.addEventListener('input', showSuggest);
sIn.addEventListener('focus', showSuggest);
sIn.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown'){ e.preventDefault(); if (!sBox.classList.contains('open')) showSuggest(); else moveSuggest(1); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); moveSuggest(-1); }
  else if (e.key === 'Enter'){ e.preventDefault(); pickSuggest(Math.max(sIdx, 0)); }
  else if (e.key === 'Escape'){ hideSuggest(); sIn.blur(); }
});
sBox.addEventListener('pointerdown', e => e.preventDefault());          // mantém o foco no campo (evita fechar antes do toque)
sBox.addEventListener('click', e => { const it = e.target.closest('.si[data-i]'); if (it) pickSuggest(+it.dataset.i); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('#sbox')) hideSuggest(); });

/* ================= seleção e ficha do país ================= */
function select(iso, fly){
  selected = iso; setSpin(false); refresh(true); renderPanel();
  document.getElementById('panel').classList.add('open'); document.body.classList.add('pan'); sizeGlobe();
  if (fly){ const f = selectedFeat(); if (f) globe.pointOfView({lat:f.properties.c[1], lng:f.properties.c[0], altitude:f.properties.alt * (MOBILE.matches ? 1.5 : 1)}, 1100); wake(3500); }
}
function deselect(){ selected = null; document.getElementById('panel').classList.remove('open'); document.body.classList.remove('pan'); sizeGlobe(); refresh(true); }
document.getElementById('close').onclick = deselect;
document.addEventListener('keydown', e=>{ if (e.key==='Escape') deselect(); });

/* ---- gráficos SVG ---- */
const CW = 350, CH = 118, PL = 36, PR = 8, PT = 8, PB = 18;
const INK = '#2a2722', OX = '#8b2e1f', BLUE = '#3b6f8f';
function xs(y){ return PL + (y-Y0)/(Y1-Y0)*(CW-PL-PR); }
function mkScale(lo, hi){ return v => CH-PB - (v-lo)/(hi-lo)*(CH-PB-PT); }
function path(arr, y0, ys){ let s=''; arr.forEach((v,i)=>{ if (v==null) return; s += (s?'L':'M') + xs(y0+i).toFixed(1)+','+ys(v).toFixed(1); }); return s; }
function axes(ys, fmt, ticks){
  let o = ''; [1950,2000,2050,2100].forEach(y=>{ o += `<line x1="${xs(y)}" x2="${xs(y)}" y1="${PT}" y2="${CH-PB}" stroke="${INK}" stroke-opacity=".13" stroke-dasharray="1 3"/><text x="${xs(y)}" y="${CH-5}" fill="#6f675a" font-size="10" text-anchor="middle" font-family="Palatino Linotype,Palatino,Georgia,serif">${y}</text>`; });
  ticks.forEach(v=>{ o += `<line x1="${PL}" x2="${CW-PR}" y1="${ys(v)}" y2="${ys(v)}" stroke="${INK}" stroke-opacity=".13" stroke-dasharray="1 3"/><text x="${PL-5}" y="${ys(v)+3}" fill="#6f675a" font-size="10" text-anchor="end" font-family="Palatino Linotype,Palatino,Georgia,serif">${fmt(v)}</text>`; });
  return o + `<rect x="${PL}" y="${PT}" width="${CW-PL-PR}" height="${CH-PB-PT}" fill="none" stroke="${INK}" stroke-opacity=".55"/>`;
}
function projShade(){ return `<rect x="${xs(SPLIT)}" y="${PT}" width="${xs(Y1)-xs(SPLIT)}" height="${CH-PB-PT}" fill="${OX}" fill-opacity=".055"/>`; }
function cursor(){ return `<line class="cur" x1="${xs(year)}" x2="${xs(year)}" y1="${PT}" y2="${CH-PB}" stroke="${INK}" stroke-width="1" stroke-dasharray="4 3"/>`; }
function updateCursor(){ document.querySelectorAll('.cur').forEach(l=>{ l.setAttribute('x1',xs(year)); l.setAttribute('x2',xs(year)); }); updateKpis(); }

function chartPop(d){
  const hi = Math.max(...d.pi.u95, ...d.p.filter(v=>v!=null)), ys = mkScale(0, hi*1.05);
  const pre = d.p.slice(0, SPLIT-Y0+1);
  const band = (u,l)=>{ const U=u.map((v,i)=>xs(SPLIT+i).toFixed(1)+','+ys(v).toFixed(1)); const L=l.map((v,i)=>xs(SPLIT+i).toFixed(1)+','+ys(v).toFixed(1)).reverse(); return 'M'+U.join('L')+'L'+L.join('L')+'Z'; };
  const raw = hi*1.05, step = Math.pow(10, Math.floor(Math.log10(raw))), n = raw/step>5 ? 2*step : step, tk = []; for (let v=n; v<raw; v+=n) tk.push(v);
  return `<svg viewBox="0 0 ${CW} ${CH}">${axes(ys,fmtPop,tk.slice(0,4))}${projShade()}
    <path d="${band(d.pi.u95,d.pi.l95)}" fill="${BLUE}" fill-opacity=".20"/><path d="${band(d.pi.u80,d.pi.l80)}" fill="${BLUE}" fill-opacity=".38"/>
    <path d="${path(pre,Y0,ys)}" fill="none" stroke="${INK}" stroke-width="1.8"/>
    <path d="${path(d.pi.md,SPLIT,ys)}" fill="none" stroke="${OX}" stroke-width="1.8"/>${cursor()}</svg>`;
}
function chartLine(d, key, lo, hi, step, color, refLine){
  const ys = mkScale(lo,hi); const tk=[]; for (let v=lo+step; v<hi; v+=step) tk.push(v);
  return `<svg viewBox="0 0 ${CW} ${CH}">${axes(ys,v=>fnum(v,0),tk)}${projShade()}
    ${refLine!=null?`<line x1="${PL}" x2="${CW-PR}" y1="${ys(refLine)}" y2="${ys(refLine)}" stroke="${OX}" stroke-dasharray="5 3"/><text x="${CW-PR-3}" y="${ys(refLine)-4}" fill="${OX}" font-size="10" text-anchor="end" font-family="Palatino Linotype,Palatino,Georgia,serif" font-style="italic">${lang==='pt'?'reposição 2,1':'replacement 2.1'}</text>`:''}
    <path d="${path(d[key],Y0,ys)}" fill="none" stroke="${color}" stroke-width="1.8"/>${cursor()}</svg>`;
}

function kpiHtml(d){
  const t = T(), k = t.kpi, u = t.u, v = key => d[key][year-Y0];
  const rows = [
    ['pop', fmtPop(d.p[year-Y0]), ''], ['g', fsgn(v('g'),2), u.g], ['t', fnum(v('t'),2), u.t], ['l', fnum(v('l'),1), u.l],
    ['a', fnum(v('a'),1), u.a], ['i', fnum(v('i'),1), u.i], ['b', fnum(v('b'),1), u.b], ['d', fnum(v('d'),1), u.d]
  ];
  return rows.map(([key,val,unit])=>`<div class="r"><span class="l">${k[key]}</span><span class="d"></span><span class="n">${val}<span class="u">${unit}</span></span></div>`).join('');
}
function updateKpis(){ const e = document.getElementById('kpis'); if (e && selected) e.innerHTML = kpiHtml(DATA[selected]); const y=document.getElementById('kyear'); if (y) y.textContent = year; const ph=document.getElementById('kph'); if (ph) ph.textContent = year>=SPLIT ? T().proj : T().est; }

function renderPanel(){
  const d = DATA[selected]; const t = T();
  const peakTxt = d.pk>=2100 ? t.peakNone() : t.peak(d.pk, d.pkLo>=2100?'≥2100':d.pkLo, d.pkHi>=2100?'≥2100':d.pkHi);
  const lastP = d.pi.md[d.pi.md.length-1];
  const ins = [peakTxt, d.nd ? t.natDec(d.nd) : t.natNo, d.rp ? t.repl(d.rp) : t.replNo];
  document.getElementById('pscroll').innerHTML = `
    <h2 class="cname">${nameOf(selected)}</h2>
    <div class="csub">${selected} · ${t.rank(d.rk)}</div>
    <span class="tag"><i style="background:${CLS_COL[d.cls]}"></i>${t.cls[d.cls]} · 2100</span>
    <h3><span id="kyear">${year}</span> <em>(<span id="kph">${year>=SPLIT?t.proj:t.est}</span>)</em></h3>
    <div class="gz" id="kpis">${kpiHtml(d)}</div>
    <h3>${t.chPop}</h3><div class="chart">${chartPop(d)}</div>
    <div class="note">${t.pi2100(fmtPop(d.pi.l95[d.pi.l95.length-1]), fmtPop(lastP), fmtPop(d.pi.u95[d.pi.u95.length-1]))}<br>${t.chNote}</div>
    <h3>${t.chTfr}</h3><div class="chart">${chartLine(d,'t',0,Math.max(7.5,Math.ceil(Math.max(...d.t.filter(v=>v!=null)))),1,INK,2.1)}</div>
    <h3>${t.chLex}</h3><div class="chart">${chartLine(d,'l',20,100,20,INK,null)}</div>
    <h3>${t.ins}</h3>
    <ul class="ins">${ins.map(x=>`<li>${x}</li>`).join('')}<li><b>${t.sign}:</b> ${t.cls[d.cls].toLowerCase()}. ${t.clsx[d.cls]}</li></ul>`;
  document.getElementById('pscroll').scrollTop = 0;
}

/* ================= início ================= */
applyLang();
sizeGlobe();
globe.pointOfView({lat:-8, lng:-50, altitude:fitAlt()}, 0);
</script>
